---
- name: Add Trivy apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris: https://get.trivy.dev/deb
    suites: generic
    components: main
    signed_by: "{{ trivy_key_url }}"

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: present
    update_cache: true
