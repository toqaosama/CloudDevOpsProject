---
- name: Add Jenkins apt repository (deb822, signing key fetched from signed_by URL)
  ansible.builtin.deb822_repository:
    name: jenkins
    types: deb
    uris: https://pkg.jenkins.io/debian-stable
    suites: binary/
    signed_by: "{{ jenkins_key_url }}"

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true
  notify: Restart jenkins

- name: Start and enable Jenkins
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Wait until Jenkins answers
  ansible.builtin.wait_for:
    port: "{{ jenkins_port }}"
    timeout: 300
