# Direct external access to the frontend through a cloud load balancer
# (AWS creates an ELB on EKS; on minikube run "minikube tunnel").
# The ingress (ingress.yaml) is the main entry point; this service is for testing app access.
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
  namespace: ivolve
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: frontend
  # login sessions are kept in pod memory -> keep each client on the same pod
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
