# Only the frontend is exposed outside the cluster (NGINX ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: ivolve
spec:
  ingressClassName: nginx
  rules:
    - host: ivolve.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
