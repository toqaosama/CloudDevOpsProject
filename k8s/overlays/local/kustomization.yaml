# minikube: images from the minikube registry addon (localhost:5000), hostpath storage.
# The Jenkins "Update Manifests" stage changes the newTag values below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: storageclass-patch.yaml
  - path: frontend-lb-patch.yaml
    target:
      kind: Service
      name: frontend-lb
images:
  - name: frontend
    newName: localhost:5000/frontend
    newTag: "1"
  - name: auth-service
    newName: localhost:5000/auth-service
    newTag: "1"
  - name: roadmap-service
    newName: localhost:5000/roadmap-service
    newTag: "latest"
